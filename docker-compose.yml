services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mplads_sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_local_only
    ports:
      - "5432:5432"
    volumes:
      - sentinel_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d mplads_sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - sentinel_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin-change-before-deployment
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - sentinel_minio:/data
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://sentinel:sentinel_local_only@postgres:5432/mplads_sentinel
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: replace-with-a-long-random-secret-before-running
      AUTO_SEED: "false"
      FRONTEND_ORIGINS: https://localhost
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["api"]

volumes:
  sentinel_postgres:
  sentinel_redis:
  sentinel_minio:

