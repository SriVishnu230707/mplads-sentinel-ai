services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE to a reviewed immutable image digest}
    environment:
      POSTGRES_DB: mplads_sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your deployment environment}
    volumes:
      - sentinel_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d mplads_sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: ${REDIS_IMAGE:?Set REDIS_IMAGE to a reviewed immutable image digest}
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in your deployment environment}
    volumes:
      - sentinel_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: ${MINIO_IMAGE:?Set MINIO_IMAGE to a reviewed immutable image digest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in your deployment environment}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in your deployment environment}
    volumes:
      - sentinel_minio:/data
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with a URL-encoded PostgreSQL password}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL with a URL-encoded Redis password}
      SECRET_KEY: ${SENTINEL_SECRET_KEY:?Set SENTINEL_SECRET_KEY in your deployment environment}
      AUTO_SEED: "false"
      FRONTEND_ORIGINS: ${SENTINEL_FRONTEND_ORIGIN:?Set SENTINEL_FRONTEND_ORIGIN in your deployment environment}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    profiles: ["api"]

volumes:
  sentinel_postgres:
  sentinel_redis:
  sentinel_minio:

